include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = vaping-duty-account

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.vapingdutyaccount.Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.

#controllers {
#}

# Microservice specific config

mongodb {
  uri = "mongodb://localhost:27017/vaping-duty-account"
  timeToLive = 900
}

microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }

    subscription {
      protocol = http
      host = localhost
      port = 8142
      clientId = "subscription stub client id"
      secret   = "override-me!"
      url {
        subscriptionSummary = "/etmp/RESTAdapter/vpd/subscription"
      }
    }

    email-verification {
      protocol = http
      host = localhost
      port = 9891
      url {
        getVerifiedEmails = "/email-verification/verification-status"
      }
    }

    vaping-duty-stubs {
      protocol = http
      host = localhost
      port = 8142
    }

    submit-preferences {
      protocol = http
      host     = localhost
      port     = 8142
      clientId = "submission stub client id"
      secret   = "override-me!"
      url {
        submitPreferences = "/etmp/RESTAdapter/email-contact-preference"
      }
    }

    circuit-breaker {
      max-failures  = 5
      call-timeout  = 10 seconds
      reset-timeout = 1 minute
    }

    retry {
      retry-attempts = 2
      retry-attempts-post = 1
      retry-attempts-delay = 500 milliseconds
    }
  }
}

downstream-apis {
  idType = "ZVPD"
  regime = "VPD"
}

enrolment {
  serviceName = "HMRC-VPD-ORG"
  identifierKey = "ZVPD"
}

crypto {
  key = "wuvdSGFABMr6sTfG0GRUpyqH3nzZM0ORjNviFgWof9M="
  isEnabled = true
}

features {
  email-verification-stub: false
  bta.tile.api: true
}

# Used for VPD Summary API "service" field
service {
  name = "Vaping Products Duty"
  id = "VPD"
}
